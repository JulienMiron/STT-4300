name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-deploy:
    # Version fixée : l'URL du Package Manager ci-dessous vise « noble » (24.04),
    # et on évite la migration automatique vers Ubuntu 26 le 19 octobre 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      # R installé depuis les dépôts Ubuntu : aucun appel à api.r-hub.io
      - name: Set up R
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev
          mkdir -p "$HOME/R/library"
          echo "R_LIBS_USER=$HOME/R/library" >> "$GITHUB_ENV"

      # Paquets binaires précompilés (Posit Package Manager) : installation rapide
      - name: Install R packages used in the notes
        run: |
          options(
            repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"),
            HTTPUserAgent = sprintf(
              "R/%s R (%s)", getRversion(),
              paste(getRversion(), R.version["platform"], R.version["arch"], R.version["os"])
            )
          )
          install.packages(c(
            "ggplot2", "rmarkdown", "knitr",
            "GLMsData", "ISLR", "MASS", "mgcv", "splines2",
            "glmnet", "clinfun", "boot", "FNN", "KernSmooth",
            "purrr", "dplyr", "tidyr", "latex2exp", "faraway"
          ), Ncpus = 2)
        shell: Rscript {0}

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render --to html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_book
