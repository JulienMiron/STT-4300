project:
  type: book
  output-dir: _book
  resources:
    - images/logit_plot.gif
    - images/lineaire_plot.gif
    - images/glm_plot.gif
    - images/cv_plot.gif
    - images/regularisation_plot.gif
    - images/knn_noyau_plot.gif
    - images/splines_plot.gif
    - images/gam_plot.gif
    - images/index_plot.gif

book:
  title: "Régression II -- STT-4300"
  #subtitle: "Rappels de régression linéaire, modèles linéaires généralisés, régression non-linéaire et non-paramétrique, modèles additifs généralisés"
  author: "Julien Miron"

  repo-url: https://github.com/JulienMiron/STT-4300
  repo-actions: [edit, issue]      # pas "source" : le dépôt contient aussi des brouillons

  page-footer:
    left: "Notes de cours STT-4300"
    right: "Généré avec Quarto"

  sidebar:
    style: floating
    collapse-level: 1              # replie tout sauf les titres de chapitre
    logo: images/logit_plot.png    # affichée au-dessus du titre dans la sidebar


  chapters:
    - index.qmd
    - 01-regression-lineaire.qmd
    - 02-regression-logistique.qmd
    - 03-modeles-lineaires-generalises.qmd
    - 04-prediction-validation-croisee.qmd
    - 05-selection-regularisation.qmd
    - 06-knn-noyau.qmd
    - 07-splines.qmd
    - 08-gam.qmd

crossref:
  chapters: true                   # numérotation des figures/tableaux tient compte du chapitre

bibliography: references.bib

# Réglages de langue et de dates (affichage en français)
lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-modified: "Dernière modification"
date-modified: last-modified       # date mise à jour automatiquement au rendu
date-format: "D MMMM YYYY"

format:
  html:
    favicon: images/logit_plot.png
    include-after-body: sidebar-gif.html   # gif/animation ajoutée après le corps de page
    include-in-header:
      - mathjax-macros.html                # macros LaTeX custom pour MathJax (bb, hb, hv, etc.)
    grid:
      sidebar-width: 300px   # sidebar de gauche (chapitres) — défaut 250px
      margin-width: 250px    # TdM de droite — défaut ~200-250px selon thème
      gutter-width: 1rem     # espace entre les colonnes

    theme: cosmo
    css: styles.css
    toc: true
    toc-expand: true
    toc-depth: 3
    number-sections: true
    code-fold: false
    smooth-scroll: true

  pdf:
    include-in-header: macros.tex
    documentclass: scrreprt
    toc: true
    number-sections: true
    keep-tex: false          # mettre à true pour inspecter le .tex généré en cas d'erreur

editor: source

filters:
  - webr                              # exécution de code R dans le navigateur
  - filtres/titre-environnements.lua  # filtre custom pour les environnements (théorème, exemple, etc.)
  - fontawesome