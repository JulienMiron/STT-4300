project:
  type: website
  output-dir: _site
  # liste explicite : sans ça, Quarto essaie aussi de rendre les fichiers de
  # notes/ et notebooks-classe/, qui sont des sous-projets Quarto indépendants
  render:
    - index.qmd
    - plan-de-cours.qmd
    - calendrier.qmd
    - Projet/projet.qmd
    - labos/labo1.qmd
    - labos/labo2.qmd
    - labos/labo3.qmd
    - labos/labo4.qmd
    - labos/labo5.qmd
    # cahier.qmd (calendrier + projet + labos en un seul PDF) n'est PAS dans
    # cette liste : il inclut via {{< include >}} des fichiers qui sont aussi
    # rendus comme pages du site, et le rendre dans la même passe cause une
    # collision (rename error) sur ces fichiers partagés. Il se rend dans une
    # passe séparée, comme notes/ ci-dessous : `quarto render cahier.qmd --to pdf`.
  resources:
    - notebooks-classe/*.html   # notebooks d'exemples en classe, liés depuis notes/exercices-en-classe.qmd
    - labos/disponibilite.json  # dates de déblocage lues par labo-disponibilite.html

website:
  title: "STT-4300 Régression II"
  site-url: https://julienmiron.github.io/STT-4300/
  repo-url: https://github.com/JulienMiron/STT-4300
  repo-actions: [edit, issue]

  page-footer:
    left: "Site de cours STT-4300"
    center: "[Julien Miron](https://julienmiron.github.io/SitePerso/)"
    right: "Généré avec Quarto"

  navbar:
    background: "#0E9E6C"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Accueil
      - href: plan-de-cours.qmd
        text: Plan de cours
      - href: calendrier.qmd
        text: Calendrier
      - href: Projet/projet.qmd
        text: Projet de session
      - text: Labos
        menu:
          - href: labos/labo1.qmd
            text: Labo 1
          - href: labos/labo2.qmd
            text: Labo 2
          - href: labos/labo3.qmd
            text: Labo 3
          - href: labos/labo4.qmd
            text: Labo 4
          - href: labos/labo5.qmd
            text: Labo 5
      - href: notes/index.html
        text: Notes de cours
    tools:
      - icon: download
        href: cahier.pdf
        text: "Télécharger le calendrier, le projet et les labos (PDF)"

lang: fr
language:
  title-block-author-single: "Auteur"
  title-block-modified: "Dernière modification"
date-modified: last-modified
date-format: "D MMMM YYYY"

format:
  html:
    favicon: notes/images/logit_courbe_annotee.png
    include-after-body:
      - logo-couleur-du-jour.html
      - date-modification-bas-page.html
      - labo-disponibilite.html
    theme:
      light: lumen
    css: styles.css
    toc: false

editor: source
