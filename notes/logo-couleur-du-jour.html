<script>
// Couleur du logo dérivée de la date du jour (même couleur toute la journée, change le lendemain).
(function () {
  var d = new Date();
  var cle = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
  var h = cle;
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  h ^= h >>> 16;
  var teinte = (h >>> 0) % 360;
  document.querySelectorAll('img.navbar-logo, img.sidebar-logo').forEach(function (img) {
    img.style.filter = 'hue-rotate(' + teinte + 'deg)';
  });
})();
</script>
