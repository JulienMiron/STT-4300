<script>
document.addEventListener("DOMContentLoaded", function () {
  const logo = document.querySelector(".sidebar-logo");
  if (!logo) return;

  const gifs = {
    "index":                              "index_plot.gif",
    "01-regression-lineaire":             "lineaire_plot.gif",
    "02-regression-logistique":           "logit_plot.gif",
    "03-modeles-lineaires-generalises":   "glm_plot.gif",
    "04-prediction-validation-croisee":   "cv_plot.gif",
    "05-selection-regularisation":        "regularisation_plot.gif",
    "06-knn-noyau":                       "knn_noyau_plot.gif",
    "07-splines":                         "splines_plot.gif",
    "08-gam":                             "gam_plot.gif"
  };

  let page = window.location.pathname.split("/").pop().replace(/\.html$/, "");
  if (page === "") page = "index";

  const gif = gifs[page];
  if (gif) {
    // Date.now() change à chaque chargement de page → force le rechargement du gif
    logo.src = logo.src.replace(/[^/]+$/, gif) + "?v=" + Date.now();
  }
});
</script>
