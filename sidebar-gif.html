<script>
document.addEventListener("DOMContentLoaded", function () {
  const logo = document.querySelector(".sidebar-logo");
  if (!logo) return;

  const path = window.location.pathname;
  const estIndex = path.endsWith("/") || path.endsWith("/index.html");

  if (estIndex) {
    logo.src = logo.src.replace("logit_plot.png", "logit_plot.gif");
  }
});
</script>
